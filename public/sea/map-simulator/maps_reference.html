                </a>

                </a>
            </nav>
        </header>

        <main class="main-content">
            <div class="simulator-layout map-layout">
                <section class="map-panel">
                    <div class="map-toolbar">
                        <div class="quick-select-wrapper">
                            <label for="map-select">Map:</label>
                            <select id="map-select" class="form-select">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>
                    <div class="map-canvas-wrap">
                        <div id="map-shell" class="map-shell" aria-label="Map canvas">
                            <div id="map-stage" class="map-stage" role="group" aria-label="Interactive map">
                                <img id="map-img" class="map-image" alt="" loading="eager" decoding="async" fetchpriority="high" />
                                <svg id="subregions-svg" class="map-subregions"
                                    xmlns="http://www.w3.org/2000/svg"></svg>
                                <div id="markers-layer" class="map-markers"></div>
                            </div>
                            <button id="zoom-reset" class="map-zoom-reset" type="button">Reset Zoom</button>
                        </div>
                    </div>
                </section>

                <div class="map-filter-stack">
                    <aside class="details-panel map-filter-panel map-options-panel">
                        <h2 data-map-options-title>Options</h2>
                        <div class="map-options">
                            <label class="map-hide-checked-toggle">
                                <input id="use-monster-portraits" type="checkbox" aria-controls="markers-layer">
                                <span data-map-monster-portraits-label>Use monster portraits</span>
                            </label>
                            <label class="map-hide-checked-toggle">
                                <input id="show-monster-portrait-labels" type="checkbox" aria-controls="markers-layer">
                                <span data-map-monster-portrait-labels-label>Show portrait label</span>
                            </label>
                            <label class="map-hide-checked-toggle">
                                <input id="hide-checked-chests" type="checkbox" aria-controls="markers-layer">
                                <span data-map-hide-checked-label>Hide checked</span>
                            </label>
                        </div>
                    </aside>
                    <aside class="details-panel map-filter-panel map-filters-panel">
                        <h2 data-map-filters-title>Filters</h2>
                        <div class="map-filters">
                            <div id="map-count" class="map-count"></div>
                            <div id="mark-type-row" class="map-mark-type-row" aria-label="Mark types"></div>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>
    <div class="refine-modal map-quest-modal" id="map-quest-modal" aria-hidden="true">
        <div class="refine-modal-backdrop" data-map-quest-modal-close></div>
        <div class="refine-modal-card" role="dialog" aria-modal="true" aria-labelledby="map-quest-modal-title">
            <div class="refine-modal-header">
                <h3 id="map-quest-modal-title">Quest Details</h3>
                <button class="refine-modal-close" type="button" data-map-quest-modal-close aria-label="Close">×</button>
            </div>
            <div class="refine-modal-body">
                <div id="map-quest-modal-content" class="map-quest-modal-content"></div>
            </div>
        </div>
    </div>
