    </header>

    <main class="main-content">
      <div class="simulator-layout equipment-layout">
        <section class="equipment-panel">
          <div class="equipment-toolbar">
            <div class="equipment-title">Equipment</div>
            <div id="equipment-count" class="equipment-count">Loading...</div>
          </div>
          <div class="equipment-filters">
            <label class="equipment-filter">
              <span>Job</span>
              <div id="equipment-filter-job" class="equipment-job-select" aria-label="Job filter">
                <button type="button" class="equipment-job-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="equipment-job-fallback" aria-hidden="true"></span>
                </button>
                <div class="equipment-job-menu" role="listbox" hidden></div>
              </div>
            </label>
            <label class="equipment-filter">
              <span>Quality</span>
              <div class="equipment-checkbox-group" id="equipment-filter-quality"></div>
            </label>
            <div class="equipment-filter equipment-filter--type">
              <span>Type</span>
              <div class="equipment-type-grid" id="equipment-filter-type" aria-label="Item type filter"></div>
              <div class="equipment-subtype-filter" id="equipment-subtype-filter" hidden>
                <div class="equipment-subtype-title" id="equipment-subtype-title">Subtype</div>
                <div class="equipment-type-grid equipment-type-grid--subtype" id="equipment-filter-subtype" aria-label="Item subtype filter"></div>
              </div>
            </div>
            <label class="equipment-filter">
              <span>Scope</span>
              <label class="equipment-toggle" for="equipment-filter-show-all" data-tooltip="This might show equipment that is not available in the game">
                <input id="equipment-filter-show-all" type="checkbox" aria-label="Show all equipment">
                <span>Show All (experimental)</span>
              </label>
            </label>
            <label class="equipment-filter">
              <span>Search</span>
              <input id="equipment-filter-keyword" class="equipment-input" type="search" placeholder="Search any text (name, desc, stats, set effects...)" aria-label="Search equipment text">
            </label>
          </div>
          <div id="equipment-grid" class="equipment-grid"></div>
          <div id="equipment-sentinel" aria-hidden="true"></div>
          <div id="equipment-empty" class="empty-state" hidden>No equipment found.</div>
        </section>

        <aside class="details-panel equipment-suit-panel">
          <h2>Set Effects</h2>
          <div class="suit-hint" id="suit-hint">Click a set to filter to its pieces (click again to clear).</div>
          <div id="suit-list" class="suit-list"></div>
        </aside>
      </div>
    </main>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <div class="refine-modal equipment-detail-modal" id="equipment-detail-modal" aria-hidden="true">
    <div class="refine-modal-backdrop" data-equipment-modal-close></div>
    <div class="refine-modal-card" role="dialog" aria-modal="true" aria-labelledby="equipment-detail-modal-title">
      <div class="refine-modal-header">
        <h3 id="equipment-detail-modal-title">Equipment Details</h3>
        <button class="refine-modal-close" type="button" data-equipment-modal-close aria-label="Close">×</button>
      </div>
      <div class="refine-modal-body">
        <div id="equipment-detail-modal-content"></div>
      </div>
    </div>
  </div>
