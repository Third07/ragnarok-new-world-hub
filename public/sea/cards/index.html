    <style>
        .card-page-shell {
            display: grid;
            grid-template-columns: 148px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .card-view-sidebar {
            position: sticky;
            top: calc(var(--sticky-header-height) + var(--sticky-header-gap));
        }

        .card-view-tabs {
            display: grid;
            gap: 12px;
        }

        .card-view-tab {
            width: 100%;
            min-width: 0;
            min-height: 72px;
            padding: 12px 10px;
            white-space: normal;
            line-height: 1.2;
        }

        .card-view-panel[hidden] {
            display: none !important;
        }

        .card-page-content {
            min-width: 0;
        }

        @media (max-width: 900px) {
            .card-page-shell {
                grid-template-columns: 1fr;
            }

            .card-view-sidebar {
                position: static;
                top: auto;
            }

            .card-view-tabs {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .card-view-tab {
                min-height: 0;
            }
        }
    </style>
</head>
