name: Deploy Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "api_token=present" >> "$GITHUB_OUTPUT"
          else
            echo "api_token=missing" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "account_id=present" >> "$GITHUB_OUTPUT"
          else
            echo "account_id=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Strict SEO audit
        run: npm run seo:audit:strict

      - name: Production build
        run: npm run build

      - name: Deploy with Wrangler credentials when available
        id: cloudflare_deploy
        continue-on-error: true
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live production content
        id: production_probe
        continue-on-error: true
        shell: bash
        run: |
          set -u
          for attempt in {1..12}; do
            curl -fsSL --max-time 20 https://rtnw.online/sea/study/ -o /tmp/study.html || true
            curl -fsSL --max-time 20 https://rtnw.online/database/ -o /tmp/database.html || true
            curl -fsSL --max-time 20 https://rtnw.online/guides/monk-build/ -o /tmp/monk.html || true

            if grep -Fq "Which RTNW quiz activities are covered?" /tmp/study.html 2>/dev/null \
              && grep -Fq "Ragnarok: The New World Database" /tmp/database.html 2>/dev/null \
              && grep -Fq "Ragnarok: The New World Monk Build" /tmp/monk.html 2>/dev/null; then
              echo "Production contains the new quiz SEO content, database page, and Monk page."
              exit 0
            fi

            sleep 5
          done

          echo "Production did not expose all three expected SEO changes during the verification window."
          exit 1

      - name: Report deployment result to PR 6
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API_TOKEN_STATE: ${{ steps.credentials.outputs.api_token }}
          ACCOUNT_ID_STATE: ${{ steps.credentials.outputs.account_id }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
          PROBE_OUTCOME: ${{ steps.production_probe.outcome }}
        shell: bash
        run: |
          gh issue comment 6 --repo "${{ github.repository }}" --body "Production deployment check for commit ${{ github.sha }}: live production probe **${PROBE_OUTCOME}**. Direct Wrangler step: **${DEPLOY_OUTCOME}**. CLOUDFLARE_API_TOKEN: **${API_TOKEN_STATE:-unknown}**. CLOUDFLARE_ACCOUNT_ID: **${ACCOUNT_ID_STATE:-unknown}**. A successful live probe confirms the existing Cloudflare Git integration published the new Quiz Answers SEO content plus /database/ and /guides/monk-build/."

      - name: Fail workflow if production verification failed
        if: steps.production_probe.outcome != 'success'
        run: exit 1
