name: Verify

on:
  push:
    branches:
      - agent/seo-style-expansion
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Strict SEO audit
        run: npm run seo:audit:strict
      - name: Production build
        run: npm run build
